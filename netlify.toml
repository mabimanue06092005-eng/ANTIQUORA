# Netlify hosts the storefront (apps/web) only. The Express API + PostgreSQL run elsewhere;
# set API_ORIGIN (Site configuration → Environment variables) to that API's https:// origin.
# The build writes apps/web/dist/_redirects, which proxies /api, /uploads and /sitemap.xml to it
# and falls back to index.html for client-side routes. See README → "Deploying: Netlify + API host".
#
# Keep Base directory and Package directory empty in the Netlify UI: npm workspaces must be
# installed from the repository root, where package-lock.json lives.

[build]
  command = "npm run build --workspace apps/web && node scripts/netlify-redirects.mjs"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed build assets never change; cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
